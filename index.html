<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15171A">
<title>Iron Ledger</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#15171A;
    --surface:#1D2024;
    --surface-2:#262A2F;
    --surface-3:#31363C;
    --line:#33383E;
    --text:#ECE9E2;
    --text-muted:#8D939B;
    --text-faint:#5C6167;
    --brass:#C9A24B;
    --brass-dim:#5C5230;
    --sage:#7FA08E;
    --rust:#C1614A;
    --radius:10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.45;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  header.top{
    padding:22px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header.top .wordmark{
    font-size:15px;
    letter-spacing:.4px;
    color:var(--text-faint);
  }
  header.top h1{
    margin:2px 0 0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.3px;
  }
  header.top .sub{color:var(--text-muted);font-size:14px;margin-top:4px;}
  main{flex:1;padding:18px 18px calc(90px + var(--safe-bottom));}
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    max-width:560px;margin:0 auto;
    padding-bottom:var(--safe-bottom);
    z-index:50;
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--text-faint);
    padding:12px 4px 10px;font-size:11.5px;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  nav.tabs button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  nav.tabs button.active{color:var(--brass);}
  nav.tabs button.active .dot{background:var(--brass);}

  h2.section-title{font-size:13px;text-transform:none;letter-spacing:.2px;color:var(--text-muted);margin:26px 0 10px;font-weight:600;}
  h2.section-title:first-child{margin-top:0;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card + .card{margin-top:0;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stack{display:flex;flex-direction:column;gap:10px;}

  .btn{
    appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--text);
    font-family:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:8px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn.primary{background:var(--brass);border-color:var(--brass);color:#1B1707;}
  .btn.danger{background:transparent;border-color:var(--rust);color:var(--rust);}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--text-muted);}
  .btn.block{width:100%;}
  .btn.small{padding:8px 12px;font-size:13px;}
  .btn:disabled{opacity:.4;}

  input[type=number], select{
    appearance:none;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:17px;padding:10px 12px;border-radius:8px;width:100%;
  }
  label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted);}

  .exercise{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--surface);}
  .exercise.done{border-color:var(--brass-dim);}
  .exercise .ex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .exercise .ex-name{font-weight:700;font-size:16px;}
  .exercise .ex-meta{color:var(--text-muted);font-size:12.5px;margin-bottom:10px;}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;}
  .set-row .set-num{color:var(--text-faint);font-size:13px;text-align:center;}
  .set-row input{text-align:center;padding:8px 4px;font-size:15px;}
  .set-row.logged input{border-color:var(--brass-dim);}
  .set-labels{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:8px;font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
  .rir-row{display:flex;gap:5px;margin-top:2px;}
  .rir-chip{flex:1;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--text-muted);background:var(--surface-2);}
  .rir-chip.sel{border-color:var(--brass);color:var(--brass);background:rgba(201,162,75,.1);}

  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill.brass{background:rgba(201,162,75,.15);color:var(--brass);}
  .pill.sage{background:rgba(127,160,142,.15);color:var(--sage);}
  .pill.rust{background:rgba(193,97,74,.15);color:var(--rust);}
  .pill.muted{background:var(--surface-3);color:var(--text-muted);}

  .bar-track{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
  .bar-fill{height:100%;background:var(--brass);}
  .bar-fill.over{background:var(--rust);}

  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:100;}
  .modal{background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:22px 20px calc(22px + var(--safe-bottom));width:100%;max-width:560px;margin:0 auto;}
  .modal h3{margin:0 0 8px;font-size:18px;}
  .modal p{color:var(--text-muted);font-size:14.5px;margin:0 0 18px;}
  .modal .actions{display:flex;gap:10px;}
  .modal .actions .btn{flex:1;}

  .wizard-step{display:none;}
  .wizard-step.active{display:block;}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .choice{border:1px solid var(--line);border-radius:8px;padding:14px 10px;text-align:center;background:var(--surface-2);}
  .choice .n{font-size:22px;font-weight:700;}
  .choice .l{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .choice.sel{border-color:var(--brass);background:rgba(201,162,75,.1);}
  .choice.sel .n{color:var(--brass);}

  .muscle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .muscle-row:last-child{border-bottom:none;}
  .muscle-row .name{font-size:14.5px;}
  .muscle-row .sets-w{width:120px;}
  .muscle-row .num{font-size:12px;color:var(--text-muted);width:56px;text-align:right;}

  .day-tab{display:inline-block;padding:8px 14px;border-radius:20px;font-size:13px;margin-right:8px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--line);}
  .day-tab.active{background:var(--brass);color:#1B1707;border-color:var(--brass);}
  .day-tab.complete{border-color:var(--brass-dim);}
  .scroller{display:flex;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;gap:0;}
  .scroller::-webkit-scrollbar{display:none;}

  .banner{border:1px solid var(--rust);background:rgba(193,97,74,.1);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:#E8B7A8;}
  .banner.info{border-color:var(--brass);background:rgba(201,162,75,.08);color:#DCC183;}

  a.link-btn{color:var(--brass);text-decoration:none;font-size:13.5px;}
  .footer-note{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:24px;}
  svg text{font-family:inherit;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wordmark">IRON LEDGER</div>
    <h1 id="headerTitle">Today</h1>
    <div class="sub" id="headerSub"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs">
    <button data-tab="today"><span class="dot"></span>Today</button>
    <button data-tab="program"><span class="dot"></span>Program</button>
    <button data-tab="progress"><span class="dot"></span>Progress</button>
    <button data-tab="history"><span class="dot"></span>History</button>
    <button data-tab="settings"><span class="dot"></span>Settings</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   IRON LEDGER — personal hypertrophy programming engine
   Single-file offline PWA. All data stored in localStorage on this device.
   Edit EQUIPMENT / EXERCISES / MUSCLES below if your gym access changes.
   ========================================================================= */

/* ---------------------------- CONFIG: EQUIPMENT -------------------------- */
// Edit this list if your gym's equipment changes. Exercises are filtered
// against this list, so removing/adding an item here changes what the
// program is allowed to prescribe.
const EQUIPMENT = ["dumbbell","barbell","squat_rack","flat_bench","incline_bench","decline_bench","leg_press","machine","bodyweight","pullup_bar"];

/* ---------------------------- CONFIG: MUSCLES ---------------------------- */
// Weekly set landmarks (sets/week). MEV = minimum effective volume (floor,
// week 1 of a mesocycle). MRV = maximum recoverable volume (ceiling, final
// accumulation week before deload). MAV = a mid-range "sweet spot" reference.
// These are approximate figures drawn from widely published volume-landmark
// research/guidance (Israetel et al.) — not exact, and you can retune them
// in Settings if a muscle group isn't recovering or is undertrained.
const MUSCLES = {
  chest:       {label:"Chest",        mev:8,  mav:14, mrv:20},
  back:        {label:"Back",         mev:10, mav:17, mrv:25},
  shoulders:   {label:"Shoulders (side)", mev:8, mav:16, mrv:22},
  rear_delts:  {label:"Rear delts",   mev:6,  mav:12, mrv:20},
  biceps:      {label:"Biceps",       mev:6,  mav:14, mrv:20},
  triceps:     {label:"Triceps",      mev:6,  mav:12, mrv:18},
  quads:       {label:"Quads",        mev:8,  mav:14, mrv:20},
  hamstrings:  {label:"Hamstrings",   mev:6,  mav:10, mrv:16},
  glutes:      {label:"Glutes",       mev:4,  mav:8,  mrv:16},
  calves:      {label:"Calves",       mev:6,  mav:12, mrv:20},
  abs:         {label:"Abs",          mev:4,  mav:12, mrv:20},
};

/* ---------------------------- CONFIG: EXERCISES --------------------------- */
// equipment: array — ALL must be in EQUIPMENT above for this to be eligible.
// primary: muscle that gets full set credit. secondary: muscles that get
// half-credit toward their weekly volume (standard RP-style bookkeeping).
// repRange: hypertrophy rep target window. type: compound|isolation, used
// to decide which exercise leads a muscle's volume for the day.
const EXERCISES = [
  {id:"bb_bench",name:"Barbell Bench Press",equipment:["barbell","flat_bench"],primary:"chest",secondary:["triceps"],repRange:[6,10],type:"compound"},
  {id:"db_bench",name:"Dumbbell Bench Press",equipment:["dumbbell","flat_bench"],primary:"chest",secondary:["triceps"],repRange:[8,12],type:"compound"},
  {id:"bb_incline",name:"Incline Barbell Press",equipment:["barbell","incline_bench"],primary:"chest",secondary:["shoulders","triceps"],repRange:[6,10],type:"compound"},
  {id:"db_incline",name:"Incline Dumbbell Press",equipment:["dumbbell","incline_bench"],primary:"chest",secondary:["shoulders","triceps"],repRange:[8,12],type:"compound"},
  {id:"bb_decline",name:"Decline Barbell Press",equipment:["barbell","decline_bench"],primary:"chest",secondary:["triceps"],repRange:[6,10],type:"compound"},
  {id:"db_fly",name:"Dumbbell Fly",equipment:["dumbbell","flat_bench"],primary:"chest",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"db_incline_fly",name:"Incline Dumbbell Fly",equipment:["dumbbell","incline_bench"],primary:"chest",secondary:[],repRange:[10,15],type:"isolation"},

  {id:"bb_row",name:"Barbell Bent-Over Row",equipment:["barbell"],primary:"back",secondary:["biceps","rear_delts"],repRange:[6,10],type:"compound"},
  {id:"db_row",name:"Dumbbell Row",equipment:["dumbbell","flat_bench"],primary:"back",secondary:["biceps","rear_delts"],repRange:[8,12],type:"compound"},
  {id:"machine_row",name:"Machine Seated Row",equipment:["machine"],primary:"back",secondary:["biceps","rear_delts"],repRange:[8,12],type:"compound"},
  {id:"db_pullover",name:"Dumbbell Pullover",equipment:["dumbbell","flat_bench"],primary:"back",secondary:["chest"],repRange:[10,15],type:"isolation"},
  {id:"pullup",name:"Pull-up",equipment:["pullup_bar"],primary:"back",secondary:["biceps"],repRange:[5,12],type:"compound"},
  {id:"chinup",name:"Chin-up",equipment:["pullup_bar"],primary:"back",secondary:["biceps"],repRange:[5,12],type:"compound"},

  {id:"ohp_bb",name:"Standing Barbell Overhead Press",equipment:["barbell","squat_rack"],primary:"shoulders",secondary:["triceps"],repRange:[6,10],type:"compound"},
  {id:"ohp_db",name:"Seated Dumbbell Shoulder Press",equipment:["dumbbell"],primary:"shoulders",secondary:["triceps"],repRange:[8,12],type:"compound"},
  {id:"lat_raise",name:"Dumbbell Lateral Raise",equipment:["dumbbell"],primary:"shoulders",secondary:[],repRange:[12,20],type:"isolation"},
  {id:"rear_fly_db",name:"Dumbbell Rear Delt Fly",equipment:["dumbbell"],primary:"rear_delts",secondary:[],repRange:[12,20],type:"isolation"},
  {id:"rear_fly_machine",name:"Machine Reverse Fly",equipment:["machine"],primary:"rear_delts",secondary:[],repRange:[12,20],type:"isolation"},

  {id:"bb_curl",name:"Barbell Curl",equipment:["barbell"],primary:"biceps",secondary:[],repRange:[8,12],type:"isolation"},
  {id:"db_curl",name:"Dumbbell Curl",equipment:["dumbbell"],primary:"biceps",secondary:[],repRange:[8,12],type:"isolation"},
  {id:"incline_curl",name:"Incline Dumbbell Curl",equipment:["dumbbell","incline_bench"],primary:"biceps",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"machine_curl",name:"Machine Bicep Curl",equipment:["machine"],primary:"biceps",secondary:[],repRange:[10,15],type:"isolation"},

  {id:"machine_tricep",name:"Machine Tricep Extension",equipment:["machine"],primary:"triceps",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"db_oh_tricep",name:"Dumbbell Overhead Tricep Extension",equipment:["dumbbell"],primary:"triceps",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"cgbp",name:"Close-Grip Barbell Bench Press",equipment:["barbell","flat_bench"],primary:"triceps",secondary:["chest"],repRange:[6,10],type:"compound"},
  {id:"skullcrusher",name:"Dumbbell Skull Crusher",equipment:["dumbbell","flat_bench"],primary:"triceps",secondary:[],repRange:[10,15],type:"isolation"},

  {id:"back_squat",name:"Barbell Back Squat",equipment:["barbell","squat_rack"],primary:"quads",secondary:["glutes"],repRange:[6,10],type:"compound"},
  {id:"leg_press",name:"Leg Press",equipment:["leg_press"],primary:"quads",secondary:["glutes","hamstrings"],repRange:[8,12],type:"compound"},
  {id:"leg_ext",name:"Machine Leg Extension",equipment:["machine"],primary:"quads",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"bulg_split",name:"Bulgarian Split Squat",equipment:["dumbbell","flat_bench"],primary:"quads",secondary:["glutes"],repRange:[8,12],type:"compound"},

  {id:"leg_curl",name:"Machine Leg Curl",equipment:["machine"],primary:"hamstrings",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"rdl_bb",name:"Barbell Romanian Deadlift",equipment:["barbell"],primary:"hamstrings",secondary:["glutes","back"],repRange:[6,10],type:"compound"},
  {id:"rdl_db",name:"Dumbbell Romanian Deadlift",equipment:["dumbbell"],primary:"hamstrings",secondary:["glutes","back"],repRange:[8,12],type:"compound"},

  {id:"hip_thrust",name:"Barbell Hip Thrust",equipment:["barbell","flat_bench"],primary:"glutes",secondary:["hamstrings"],repRange:[8,12],type:"compound"},

  {id:"calf_leg_press",name:"Leg Press Calf Raise",equipment:["leg_press"],primary:"calves",secondary:[],repRange:[10,20],type:"isolation"},
  {id:"calf_db",name:"Standing Dumbbell Calf Raise",equipment:["dumbbell"],primary:"calves",secondary:[],repRange:[10,20],type:"isolation"},

  {id:"decline_situp",name:"Weighted Decline Sit-up",equipment:["dumbbell","decline_bench"],primary:"abs",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"side_bend",name:"Dumbbell Side Bend",equipment:["dumbbell"],primary:"abs",secondary:[],repRange:[10,15],type:"isolation"},
  {id:"plank",name:"Weighted Plank",equipment:["bodyweight"],primary:"abs",secondary:[],repRange:[1,1],type:"isolation",holdSeconds:true},
];

const ELIGIBLE = EXERCISES.filter(ex => ex.equipment.every(e => EQUIPMENT.includes(e)));
const byMuscle = {};
Object.keys(MUSCLES).forEach(m => byMuscle[m] = ELIGIBLE.filter(ex => ex.primary === m)
  .sort((a,b) => (a.type==="compound"?0:1) - (b.type==="compound"?0:1)));

/* ---------------------------- SPLIT TEMPLATES ----------------------------- */
const DAY_TYPE_MUSCLES = {
  full:  Object.keys(MUSCLES),
  upper: ["chest","back","shoulders","rear_delts","biceps","triceps"],
  lower: ["quads","hamstrings","glutes","calves","abs"],
  push:  ["chest","shoulders","triceps"],
  pull:  ["back","rear_delts","biceps"],
  legs:  ["quads","hamstrings","glutes","calves","abs"],
};
const SPLITS = {
  1:["full"],
  2:["full","full"],
  3:["full","full","full"],
  4:["upper","lower","upper","lower"],
  5:["upper","lower","push","pull","legs"],
  6:["push","pull","legs","push","pull","legs"],
};
function dayLabel(type,idx){
  const names = {full:"Full Body",upper:"Upper",lower:"Lower",push:"Push",pull:"Pull",legs:"Legs"};
  return names[type] + (SPLITS[currentDaysCount()]?.filter((t,i)=>t===type&&i<=idx).length>1 ? " "+String.fromCharCode(65+SPLITS[currentDaysCount()].slice(0,idx+1).filter(t=>t===type).length-1) : "");
}
function currentDaysCount(){ return state.activeMesoId ? getMeso(state.activeMesoId).daysPerWeek : 3; }

// Heaviest, most systemically fatiguing compounds go first in a session,
// smaller isolation work goes last — standard fatigue-management ordering.
function exercisePriority(ex){
  if(!ex) return 3;
  const bigCompoundIds = ["back_squat","rdl_bb","rdl_db","hip_thrust","leg_press","bulg_split"];
  if(ex.type === "compound" && (ex.equipment.includes("squat_rack") || bigCompoundIds.includes(ex.id))) return 1;
  if(ex.type === "compound") return 2;
  return 3;
}

// Suggested (not enforced) day-of-week spacing so the same muscle generally
// gets ~48h before its next direct hit, rather than back-to-back sessions.
const SUGGESTED_SCHEDULE = {
  1: ["any day"],
  2: ["Mon","Thu"],
  3: ["Mon","Wed","Fri"],
  4: ["Mon","Tue","Thu","Fri"],
  5: ["Mon","Tue","Wed","Fri","Sat"],
  6: ["Mon","Tue","Wed","Thu","Fri","Sat"],
};

/* ---------------------------- STATE ---------------------------------- */
const STORAGE_KEY = "iron_ledger_state_v1";
let state = loadState();
function defaultState(){
  return {
    mesocycles: [], activeMesoId: null, tab: "today",
    muscleLandmarks: JSON.parse(JSON.stringify(MUSCLES)),
    increments: { barbell:10, dumbbell:5, leg_press:10, machine:10, pullup_bar:5 },
    protein: { workout:1.0, rest:0.8 },
    bodyLog: [], // {ts, weightLb}
    sessionSetCap: 24 // practical ceiling on total working sets in one session
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    // shallow Object.assign above lets an old saved `increments`/`protein`/
    // `muscleLandmarks` object fully shadow the new defaults, hiding any
    // equipment or field added in a later version. Merge those nested
    // objects key-by-key instead so new defaults still show up.
    merged.increments = Object.assign(defaultState().increments, parsed.increments || {});
    merged.protein = Object.assign(defaultState().protein, parsed.protein || {});
    merged.muscleLandmarks = Object.assign(defaultState().muscleLandmarks, parsed.muscleLandmarks || {});
    return merged;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getMeso(id){ return state.mesocycles.find(m=>m.id===id); }
function activeMeso(){ return state.activeMesoId ? getMeso(state.activeMesoId) : null; }
function landmark(muscle){ return state.muscleLandmarks[muscle] || MUSCLES[muscle]; }

/* ---------------------------- MESOCYCLE GENERATION ------------------------ */
function createMesocycle({lengthWeeks, daysPerWeek, startDate}){
  const accumWeeks = lengthWeeks - 1; // last week of `lengthWeeks` is the deload
  const split = SPLITS[daysPerWeek];
  const id = "meso_" + Date.now();
  const meso = {
    id, startDate, lengthWeeks, daysPerWeek, accumWeeks,
    createdAt: Date.now(),
    exerciseState: {}, // exerciseId -> {lastWeight,lastReps,lastRIR}
    weeks: [],
  };
  for(let w=0; w<lengthWeeks; w++){
    const isDeload = (w === lengthWeeks-1);
    meso.weeks.push(buildWeek(meso, w, isDeload, split));
  }
  state.mesocycles.push(meso);
  state.activeMesoId = id;
  saveState();
  return meso;
}

function targetSetsForWeek(muscle, weekIdx, accumWeeks, isDeload){
  const lm = landmark(muscle);
  if(isDeload) return Math.max(1, Math.round(lm.mev * 0.45));
  if(accumWeeks<=1) return lm.mev;
  const frac = weekIdx / (accumWeeks-1); // 0 -> 1 across accumulation block
  return Math.round(lm.mev + (lm.mrv - lm.mev) * frac);
}
function targetRIRForWeek(weekIdx, accumWeeks, isDeload){
  if(isDeload) return 4.5;
  if(accumWeeks<=1) return 2;
  const frac = weekIdx / (accumWeeks-1);
  return Math.round((3.5 - frac*3.0)*2)/2; // 3.5 RIR week1 -> ~0.5 RIR last accum week
}

function buildWeek(meso, weekIdx, isDeload, split){
  // 1. weekly target sets per muscle
  const weeklyTargets = {};
  Object.keys(MUSCLES).forEach(m => weeklyTargets[m] = targetSetsForWeek(m, weekIdx, meso.accumWeeks, isDeload));
  const targetRIR = targetRIRForWeek(weekIdx, meso.accumWeeks, isDeload);

  // 2. how many days train each muscle this week
  const daysForMuscle = {};
  Object.keys(MUSCLES).forEach(m=>daysForMuscle[m]=0);
  split.forEach(dayType => DAY_TYPE_MUSCLES[dayType].forEach(m => daysForMuscle[m]++));

  const sessions = split.map((dayType, dayIdx) => {
    const planned = [];
    DAY_TYPE_MUSCLES[dayType].forEach(muscle => {
      const totalForMuscle = weeklyTargets[muscle];
      const perDay = Math.max(1, Math.round(totalForMuscle / daysForMuscle[muscle]));
      const pool = byMuscle[muscle];
      if(!pool || !pool.length) return;
      // rotate exercise choice by week+day for variety
      const primaryEx = pool[(weekIdx + dayIdx) % pool.length];
      let remaining = perDay;
      const compoundSets = pool.filter(p=>p.type==="compound").length ? Math.min(remaining, Math.max(2, Math.ceil(perDay*0.65))) : 0;
      if(primaryEx.type==="compound" || pool.length===1){
        planned.push({exerciseId:primaryEx.id, muscle, sets: Math.min(remaining,perDay), targetRIR});
        remaining = 0;
      } else {
        planned.push({exerciseId:primaryEx.id, muscle, sets: Math.min(remaining, compoundSets||remaining), targetRIR});
        remaining -= Math.min(remaining, compoundSets||remaining);
      }
      if(remaining > 0){
        const secondaryPool = pool.filter(p=>p.id!==primaryEx.id);
        const secondEx = secondaryPool.length ? secondaryPool[(weekIdx+dayIdx+1)%secondaryPool.length] : primaryEx;
        const existing = planned.find(p=>p.exerciseId===secondEx.id);
        if(existing) existing.sets += remaining;
        else planned.push({exerciseId:secondEx.id, muscle, sets: remaining, targetRIR});
      }
    });
    return {
      dayIdx, dayType, label: null, // label computed at render time
      status: "pending", // pending | done | skipped
      planned: applySessionCapAndOrder(planned),
      capped: sessionExceedsCap(planned),
      logs: {}, // exerciseId -> [{reps,weight,rir}]
      date: null,
    };
  });

  return { weekIdx, isDeload, targetRIR, weeklyTargets, sessions };
}

// A session that tries to hit many muscle groups at once (full-body, PPL)
// can mathematically climb toward a total set count no real gym session
// should run. Rather than silently letting sessions balloon to 60-70+ sets
// as weekly volume approaches MRV, scale every muscle's allocation for that
// session down proportionally to fit a practical cap, then order what's left
// by fatigue priority (heavy compounds first, isolation last).
function sessionExceedsCap(planned){
  const total = planned.reduce((s,p)=>s+p.sets,0);
  return total > (state.sessionSetCap || 24);
}
function applySessionCapAndOrder(planned){
  const cap = state.sessionSetCap || 24;
  const total = planned.reduce((s,p)=>s+p.sets,0);
  let scaled = planned;
  if(total > cap){
    const scale = cap/total;
    scaled = planned.map(p => ({...p, sets: Math.max(1, Math.round(p.sets*scale))}));
  }
  return scaled.slice().sort((a,b) => exercisePriority(exObj(a.exerciseId)) - exercisePriority(exObj(b.exerciseId)));
}

/* ---------------------------- PROGRESSION ENGINE --------------------------- */
// Weight only ever moves UP, in fixed real-world increments (set in Settings —
// default barbell 10lb, dumbbell 5lb, leg press/other machines 10lb). This is
// a double-progression scheme, not a percentage-based one: reps climb each
// successful session until the top of the exercise's rep range is reached at
// or above target RIR, at which point weight jumps one increment and reps
// reset to the bottom of the range. If a session comes in noticeably harder
// than the planned RIR, reps ease back instead — weight is never reduced.
const EQUIP_PRIORITY = ["barbell","dumbbell","leg_press","machine","pullup_bar"];
function incrementFor(exercise){
  const key = EQUIP_PRIORITY.find(e => exercise.equipment.includes(e));
  if(!key) return 0;
  return state.increments[key] ?? 5;
}
function nextPrescription(exercise, priorState, sessionLogs, targetRIR){
  const [lo,hi] = exercise.repRange;
  const inc = incrementFor(exercise);
  const last = sessionLogs[sessionLogs.length-1];
  const weightUsed = last.weight;
  let repTarget = priorState?.repTarget ?? lo;
  let weight = weightUsed;
  // An easy first set can mask a grinding last set, so lean on the final
  // one or two sets — the ones that actually test whether you're ready to
  // progress — rather than diluting the signal across the whole session.
  const recent = sessionLogs.slice(-2);
  const avgRIR = recent.reduce((s,l)=>s+(l.rir ?? targetRIR),0)/recent.length;
  const maxReps = last.reps;
  let note;
  if(maxReps >= hi && avgRIR >= targetRIR){
    weight = inc ? weight + inc : weight;
    repTarget = lo;
    note = inc ? `Hit ${hi} at target RIR — up to ${weight} next time, back to ${lo} reps.` : `Hit ${hi} reps at target RIR — nice progress.`;
  } else if(avgRIR >= targetRIR){
    repTarget = Math.min(hi, repTarget+1);
    note = `On track — aim for ${repTarget} reps next time at ${weight}.`;
  } else if(avgRIR <= targetRIR - 2){
    repTarget = Math.max(lo, repTarget-1);
    note = `Harder than planned — ease to ${repTarget} reps at ${weight} next time.`;
  } else {
    note = `Repeat ${repTarget} reps at ${weight}.`;
  }
  return {weight, repTarget, note};
}

/* ---------------------------- SET LOGGING --------------------------------- */
function logSet(mesoId, weekIdx, dayIdx, exerciseId, entry){
  const meso = getMeso(mesoId);
  const session = meso.weeks[weekIdx].sessions[dayIdx];
  if(!session.logs[exerciseId]) session.logs[exerciseId] = [];
  session.logs[exerciseId].push(entry);
  const ex = exObj(exerciseId);
  const prior = meso.exerciseState[exerciseId];
  const targetRIR = entry.targetRIR ?? 2;
  const pres = nextPrescription(ex, prior, session.logs[exerciseId], targetRIR);
  meso.exerciseState[exerciseId] = { weight: pres.weight, repTarget: pres.repTarget, note: pres.note, lastRIR: entry.rir };
  saveState();
}
function markSessionDone(mesoId, weekIdx, dayIdx){
  const meso = getMeso(mesoId);
  meso.weeks[weekIdx].sessions[dayIdx].status = "done";
  meso.weeks[weekIdx].sessions[dayIdx].date = Date.now();
  saveState();
}

/* ---------------------------- SKIP + REDISTRIBUTE -------------------------- */
function skipSession(mesoId, weekIdx, dayIdx){
  const meso = getMeso(mesoId);
  const week = meso.weeks[weekIdx];
  const session = week.sessions[dayIdx];
  session.status = "skipped";
  session.date = Date.now();

  // Gather the lost sets, grouped by muscle
  const lost = {};
  session.planned.forEach(p => { lost[p.muscle] = (lost[p.muscle]||0) + p.sets; });

  // Remaining sessions this week that are still pending
  const remaining = week.sessions.filter((s,i)=> i!==dayIdx && s.status==="pending");
  if(remaining.length === 0){ saveState(); return; }

  Object.entries(lost).forEach(([muscle, lostSets])=>{
    // find remaining sessions that already train this muscle; else any remaining session
    let targets = remaining.filter(s => DAY_TYPE_MUSCLES[s.dayType].includes(muscle));
    if(targets.length === 0) targets = remaining;
    // cap how much we pile onto any single day: distribute, don't dump it all on one
    const perTarget = Math.ceil(lostSets / targets.length);
    targets.forEach(s => {
      const addSets = Math.min(perTarget, lostSets);
      if(addSets <= 0) return;
      const existing = s.planned.find(p=>p.muscle===muscle);
      if(existing){
        existing.sets += addSets;
      } else {
        const pool = byMuscle[muscle];
        if(pool && pool.length){
          const ex = pool[0];
          s.planned.push({exerciseId: ex.id, muscle, sets: addSets, targetRIR: week.targetRIR});
        }
      }
    });
  });
  saveState();
}

/* ---------------------------- FATIGUE / EARLY DELOAD FLAG ------------------ */
function fatigueWarning(meso){
  if(!meso) return null;
  const cur = currentWeekIndex(meso);
  if(cur < 1 || meso.weeks[cur].isDeload) return null;
  let missed = 0, total = 0;
  [cur-1, cur].forEach(wi=>{
    if(wi<0) return;
    meso.weeks[wi].sessions.forEach(s=>{
      Object.entries(s.logs).forEach(([exId, entries])=>{
        entries.forEach(e=>{
          total++;
          if((e.rir ?? 2) <= (e.targetRIR ?? 2) - 2) missed++;
        });
      });
    });
  });
  if(total >= 8 && missed/total > 0.4){
    return "Several sets over the last two weeks came in well harder than planned. That's a real fatigue signal — consider pulling the deload week forward rather than pushing through.";
  }
  return null;
}

function currentWeekIndex(meso){
  for(let i=0;i<meso.weeks.length;i++){
    const allDone = meso.weeks[i].sessions.every(s=>s.status!=="pending");
    if(!allDone) return i;
  }
  return meso.weeks.length-1;
}
function nextPendingSession(meso){
  const wi = currentWeekIndex(meso);
  const week = meso.weeks[wi];
  const di = week.sessions.findIndex(s=>s.status==="pending");
  if(di===-1) return null;
  return {weekIdx:wi, dayIdx:di, session:week.sessions[di], week};
}

});

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });

  if(state.tab==="today") renderToday(meso);
  else if(state.tab==="program") renderProgram(meso);

function exName(id){ return EXERCISES.find(e=>e.id===id)?.name || id; }
function exObj(id){ return EXERCISES.find(e=>e.id===id); }
function niceDayLabel(meso, wi, di){
  const type = meso.weeks[wi].sessions[di].dayType;
  const names = {full:"Full Body",upper:"Upper",lower:"Lower",push:"Push",pull:"Pull",legs:"Legs"};
  const split = SPLITS[meso.daysPerWeek];
  const occurrence = split.slice(0,di+1).filter(t=>t===type).length;
  const totalOfType = split.filter(t=>t===type).length;
  return names[type] + (totalOfType>1 ? " "+String.fromCharCode(64+occurrence) : "");
}

/* ----- TODAY TAB ----- */
function renderToday(meso){
  if(!meso){
    headerTitle.textContent = "Today";
    headerSub.textContent = "";
    mainEl.innerHTML = `<div class="empty"><div class="big">🏋️</div>

  }

  const week = meso.weeks[wi];
  headerTitle.textContent = week.isDeload ? "Recovery week" : `Week ${wi+1} of ${meso.accumWeeks}`;
  headerSub.textContent = week.isDeload ? "Lighter load, higher reps in reserve — let fatigue dissipate." : `Target RIR this week: ${week.targetRIR}`;

  if(!pending){
    const allWeeksDone = meso.weeks.every(w=>w.sessions.every(s=>s.status!=="pending"));

  }

  let html = "";
  if(warn) html += `<div class="banner">${warn}</div>`;
  if(session.capped) html += `<div class="banner info">This session's volume was scaled down to fit a practical set cap (${state.sessionSetCap} sets) rather than chasing every muscle's full landmark at once. Add a training day next mesocycle to unlock more programmed volume.</div>`;
  html += `<div class="row" style="margin-bottom:14px;">
      <div>
        <div class="pill brass">${label}</div>
      </div>
      <button class="btn ghost small" onclick="confirmSkip('${meso.id}',${wi},${dayIdx})">Skip today</button>
    </div>`;

  session.planned.forEach(p => {
    const ex = exObj(p.exerciseId);
    if(!ex) return;
    const logs = session.logs[p.exerciseId] || [];
    const priorState = meso.exerciseState[p.exerciseId];
    const startWeight = priorState?.weight ?? "";
    const startReps = priorState?.repTarget ?? ex.repRange[0];
    const allLogged = logs.length >= p.sets;
    const repLabel = ex.holdSeconds ? "seconds held" : `${ex.repRange[0]}–${ex.repRange[1]} reps`;
    const restLabel = ex.holdSeconds ? "" : (ex.type === "compound" ? " · rest 2–3 min" : " · rest 60–90 sec");
    const isBodyweightBased = ex.equipment.includes("pullup_bar") || ex.equipment.includes("bodyweight");
    const weightColLabel = isBodyweightBased ? "Added wt (lb)" : "Weight (lb)";
    html += `<div class="exercise ${allLogged?'done':''}">
      <div class="ex-head"><span class="ex-name">${ex.name}</span><span class="pill muted">${p.sets} sets</span></div>
      <div class="ex-meta">Target ${repLabel} · RIR ${p.targetRIR}${restLabel}${priorState?.note ? ` · <span style="color:var(--brass)">${priorState.note}</span>` : ""}</div>
      <div class="set-labels"><div></div><div>${weightColLabel}</div><div>${ex.holdSeconds?'Sec':'Reps'}</div><div>RIR</div></div>
      <div id="sets_${meso.id}_${wi}_${dayIdx}_${p.exerciseId}">
      ${renderSetRows(meso, wi, dayIdx, p, logs, startWeight, startReps, ex)}
      </div>
    </div>`;
  });

  const allDone = session.planned.every(p => (session.logs[p.exerciseId]||[]).length >= p.sets);
  html += `<button class="btn primary block" style="margin-top:6px;" ${allDone?'':'disabled'} onclick="finishSession('${meso.id}',${wi},${dayIdx})">Finish session</button>`;
  mainEl.innerHTML = html;
}

function renderSetRows(meso, wi, di, planned, logs, startWeight, startReps, ex){
  let rows = "";
  const totalRows = Math.max(planned.sets, logs.length);
  for(let i=0;i<totalRows;i++){
    const logged = logs[i];
    const idPrefix = `${meso.id}_${wi}_${di}_${planned.exerciseId}_${i}`;
    if(logged){
      rows += `<div class="set-row logged">
        <div class="set-num">${i+1}</div>
        <input type="number" value="${logged.weight}" disabled>
        <input type="number" value="${logged.reps}" disabled>
        <input type="number" value="${logged.rir}" disabled>
      </div>`;
    } else {
      rows += `<div class="set-row">
        <div class="set-num">${i+1}</div>
        <input type="number" inputmode="decimal" id="w_${idPrefix}" value="${startWeight??''}" placeholder="lb">
        <input type="number" inputmode="numeric" id="r_${idPrefix}" value="${startReps??''}" placeholder="${ex.repRange[0]}-${ex.repRange[1]}">
        <input type="number" inputmode="numeric" id="i_${idPrefix}" placeholder="${planned.targetRIR}">
      </div>`;
    }
  }
  if(logs.length < planned.sets){
    const i = logs.length;
    const idPrefix = `${meso.id}_${wi}_${di}_${planned.exerciseId}_${i}`;
    rows += `<button class="btn small block" style="margin-top:4px;" onclick="submitSet('${meso.id}',${wi},${di},'${planned.exerciseId}','${idPrefix}',${planned.targetRIR})">Log set ${i+1}</button>`;
  }
  return rows;
}

function submitSet(mesoId, wi, di, exId, idPrefix, targetRIR){
  const w = parseFloat(document.getElementById(`w_${idPrefix}`).value);
  const r = parseInt(document.getElementById(`r_${idPrefix}`).value, 10);
  const rir = parseFloat(document.getElementById(`i_${idPrefix}`).value);
  if(isNaN(w) || isNaN(r) || isNaN(rir)){ alert("Enter weight, reps, and RIR before logging the set."); return; }
  logSet(mesoId, wi, di, exId, {weight:w, reps:r, rir, targetRIR, ts:Date.now()});
  render();
}

function finishSession(mesoId, wi, di){
  markSessionDone(mesoId, wi, di);
  render();
}

function confirmSkip(mesoId, wi, di){

}

/* ----- VOLUME / MILESTONE HELPERS ----- */
function totalVolumeForWeek(meso, weekIdx){
  let total = 0;
  meso.weeks[weekIdx].sessions.forEach(s=>{
    Object.values(s.logs).forEach(entries=>entries.forEach(e=>{ total += e.weight * e.reps; }));
  });
  return total;
}
function muscleVolumeForWeek(meso, weekIdx){
  const out = {};
  Object.keys(MUSCLES).forEach(m=>out[m]=0);
  meso.weeks[weekIdx].sessions.forEach(s=>{
    Object.entries(s.logs).forEach(([exId, entries])=>{
      const ex = exObj(exId);
      if(!ex) return;
      entries.forEach(e=>{ out[ex.primary] += e.weight * e.reps; });
    });
  });
  return out;
}
function allLoggedSetsFlat(){
  const out = [];
  state.mesocycles.forEach(m=>{
    m.weeks.forEach(w=>{
      w.sessions.forEach(s=>{
        Object.values(s.logs).forEach(entries=>entries.forEach(e=>{
          out.push({ts:e.ts||Date.now(), volume:e.weight*e.reps});
        }));
      });
    });
  });
  return out;
}
function monthKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()}`; }
function monthlyVolumes(){
  const flat = allLoggedSetsFlat();
  const byMonth = {};
  flat.forEach(e=>{ const k=monthKey(e.ts); byMonth[k]=(byMonth[k]||0)+e.volume; });
  return Object.keys(byMonth).sort().map(k=>({key:k, volume:byMonth[k]}));
}

  let html = "";

  // Body weight & protein
  const lastBW = state.bodyLog.length ? state.bodyLog[state.bodyLog.length-1].weightLb : null;
  html += `<h2 class="section-title" style="margin-top:0;">Body weight &amp; protein</h2><div class="card">`;
  if(lastBW){
    const workoutG = Math.round(lastBW * state.protein.workout);
    const restG = Math.round(lastBW * state.protein.rest);
    html += `<div class="row"><span>Latest weight</span><span class="pill muted">${lastBW} lb</span></div>
      <div class="row" style="margin-top:8px;"><span>Training day protein target</span><span class="pill brass">${workoutG} g</span></div>
      <div class="row" style="margin-top:8px;"><span>Rest day protein target</span><span class="pill brass">${restG} g</span></div>`;
    if(state.bodyLog.length>1) html += `<div style="margin-top:12px;">${sparkline(state.bodyLog.map(b=>b.weightLb))}</div>`;
  } else {
    html += `<div style="color:var(--text-muted);font-size:13.5px;">Log your body weight in Settings to see protein targets here.</div>`;
  }
  html += `</div>`;

  // Milestones
  const thisWeekVol = totalVolumeForWeek(meso, wi);
  const prevWeekVol = wi>0 ? totalVolumeForWeek(meso, wi-1) : null;
  html += `<h2 class="section-title">Milestones</h2><div class="card">`;
  html += `<div class="row"><span>This week's total volume</span><span class="pill brass">${Math.round(thisWeekVol).toLocaleString()} lb</span></div>`;
  if(prevWeekVol!=null && prevWeekVol>0){
    const pct = ((thisWeekVol-prevWeekVol)/prevWeekVol*100).toFixed(1);
    html += `<div class="row" style="margin-top:8px;"><span>Vs. last week</span><span class="pill ${pct>=0?'sage':'rust'}">${pct>=0?'+':''}${pct}%</span></div>`;
  }
  const months = monthlyVolumes();
  if(months.length){
    const curM = months[months.length-1];
    const prevM = months.length>1 ? months[months.length-2] : null;
    html += `<div class="row" style="margin-top:8px;"><span>This month's total volume</span><span class="pill brass">${Math.round(curM.volume).toLocaleString()} lb</span></div>`;
    if(prevM && prevM.volume>0){
      const pctM = ((curM.volume-prevM.volume)/prevM.volume*100).toFixed(1);
      html += `<div class="row" style="margin-top:8px;"><span>Vs. last month</span><span class="pill ${pctM>=0?'sage':'rust'}">${pctM>=0?'+':''}${pctM}%</span></div>`;
    }
  }
  const lastAccumIdx = meso.accumWeeks - 1;
  if(wi >= lastAccumIdx){
    const week1Vol = totalVolumeForWeek(meso, 0);
    const finalVol = totalVolumeForWeek(meso, lastAccumIdx);
    if(week1Vol>0){
      const pctC = ((finalVol-week1Vol)/week1Vol*100).toFixed(1);
      html += `<div class="row" style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px;"><span>Cycle: week 1 vs. final week</span><span class="pill ${pctC>=0?'sage':'rust'}">${pctC>=0?'+':''}${pctC}%</span></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${Math.round(week1Vol).toLocaleString()} lb → ${Math.round(finalVol).toLocaleString()} lb</div>`;
    }
  }
  html += `</div>`;

  // Per-muscle weight lifted this week
  html += `<h2 class="section-title">Weight lifted per muscle — this week</h2><div class="card">`;
  const mv = muscleVolumeForWeek(meso, wi);
  const maxV = Math.max(1, ...Object.values(mv));
  Object.entries(mv).forEach(([m,vol])=>{
    const lm = landmark(m);
    const pct = Math.round((vol/maxV)*100);
    html += `<div class="muscle-row"><span class="name">${lm.label}</span>
      <div class="sets-w bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="num">${Math.round(vol).toLocaleString()} lb</span></div>`;
  });
  html += `</div>`;

  // aggregate estimated e1RM trend per exercise across all logs in this meso
  const perExercise = {};
  meso.weeks.forEach(week=>{
    week.sessions.forEach(s=>{
      Object.entries(s.logs).forEach(([exId, entries])=>{
        entries.forEach(e=>{
          const e1rm = e.weight * (1 + e.reps/30); // Epley estimate
          perExercise[exId] = perExercise[exId] || [];
          perExercise[exId].push(e1rm);
        });
      });
    });
  });
  html += `<h2 class="section-title">Estimated strength trend (this mesocycle)</h2>`;
  const ids = Object.keys(perExercise);
  if(!ids.length){ html += `<div class="empty"><div class="big">📊</div><p>Log a few sessions to see trend lines.</p></div>`; }
  ids.forEach(exId=>{
    html += `<div class="card"><div class="row" style="margin-bottom:8px;"><b>${exName(exId)}</b></div>${sparkline(perExercise[exId])}</div>`;
  });

  html += `<h2 class="section-title">Weekly volume vs. landmarks</h2><div class="card">`;
  Object.entries(meso.weeks[wi].weeklyTargets).forEach(([m,sets])=>{
    const lm = landmark(m);
    html += `<div class="muscle-row"><span class="name">${lm.label}</span>
      <span class="num" style="width:auto;">MEV ${lm.mev} · planned ${sets} · MRV ${lm.mrv}</span></div>`;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
}

function sparkline(values){
  if(values.length<2) return `<div style="color:var(--text-muted);font-size:13px;">Need at least 2 logged sets to plot a trend.</div>`;
  const w=520,h=60,pad=6;
  const min=Math.min(...values), max=Math.max(...values);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-2*pad);
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#C9A24B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ----- HISTORY TAB ----- */
function renderHistory(meso){
  headerTitle.textContent = "History";
  headerSub.textContent = "";
  const all = state.mesocycles.slice().reverse();
  if(!all.length){ mainEl.innerHTML = `<div class="empty"><div class="big">🗂️</div><p>No mesocycles yet.</p></div>`; return; }
  let html = "";
  all.forEach(m=>{
    const done = m.weeks.flatMap(w=>w.sessions).filter(s=>s.status==="done").length;
    const skipped = m.weeks.flatMap(w=>w.sessions).filter(s=>s.status==="skipped").length;
    const total = m.weeks.flatMap(w=>w.sessions).length;
    html += `<div class="card">
      <div class="row"><b>${new Date(m.createdAt).toLocaleDateString()}</b>${m.id===state.activeMesoId?'<span class="pill brass">active</span>':''}</div>
      <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">${m.lengthWeeks} weeks · ${m.daysPerWeek}x/week · ${done}/${total} sessions completed${skipped?`, ${skipped} skipped`:''}</div>
    </div>`;
  });
  mainEl.innerHTML = html;
}

/* ----- SETTINGS TAB ----- */
function renderSettings(meso){
  headerTitle.textContent = "Settings";
  headerSub.textContent = "";
  let html = `<h2 class="section-title" style="margin-top:0;">Volume landmarks (sets/week)</h2>
    <div class="card">`;
  Object.entries(state.muscleLandmarks).forEach(([key,lm])=>{
    html += `<div class="muscle-row">
      <span class="name">${lm.label}</span>
      <span style="display:flex;gap:6px;">
        <input type="number" style="width:52px;padding:6px;font-size:13px;" value="${lm.mev}" onchange="updateLandmark('${key}','mev',this.value)">
        <input type="number" style="width:52px;padding:6px;font-size:13px;" value="${lm.mav}" onchange="updateLandmark('${key}','mav',this.value)">
        <input type="number" style="width:52px;padding:6px;font-size:13px;" value="${lm.mrv}" onchange="updateLandmark('${key}','mrv',this.value)">
      </span>
    </div>`;
  });
  html += `</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:20px;">Columns: MEV / MAV / MRV. Changes apply to mesocycles you create after saving — they don't retroactively edit an in-progress block.</div>`;

  html += `<h2 class="section-title">Weight increments</h2><div class="card">
    <div class="muscle-row"><span class="name">Barbell</span><input type="number" style="width:70px;" value="${state.increments.barbell}" onchange="updateIncrement('barbell',this.value)"></div>
    <div class="muscle-row"><span class="name">Dumbbell</span><input type="number" style="width:70px;" value="${state.increments.dumbbell}" onchange="updateIncrement('dumbbell',this.value)"></div>
    <div class="muscle-row"><span class="name">Leg press</span><input type="number" style="width:70px;" value="${state.increments.leg_press}" onchange="updateIncrement('leg_press',this.value)"></div>
    <div class="muscle-row"><span class="name">Other machines</span><input type="number" style="width:70px;" value="${state.increments.machine}" onchange="updateIncrement('machine',this.value)"></div>
    <div class="muscle-row"><span class="name">Pull-up bar (added weight)</span><input type="number" style="width:70px;" value="${state.increments.pullup_bar}" onchange="updateIncrement('pullup_bar',this.value)"></div>
  </div>
  <div style="font-size:12px;color:var(--text-muted);margin-bottom:20px;">Weight only ever moves up, by these increments. The app adds reps first and only bumps weight once you've hit the top of an exercise's rep range at your target RIR.</div>

  <h2 class="section-title">Session length</h2><div class="card">
    <div class="muscle-row"><span class="name">Max working sets per session</span><input type="number" style="width:70px;" value="${state.sessionSetCap}" onchange="updateSessionCap(this.value)"></div>
  </div>
  <div style="font-size:12px;color:var(--text-muted);margin-bottom:20px;">When a week's programmed volume across all trained muscles would exceed this in one session, every muscle's sets for that session are scaled down proportionally rather than letting the session balloon. Raise this only if you genuinely have time for longer sessions.</div>`;

  html += `<h2 class="section-title">Body weight &amp; protein</h2>
    <div class="card">
      <label class="field">Log current body weight (lb)</label>
      <div class="row" style="margin-top:6px;gap:8px;">
        <input type="number" id="newBodyWeight" placeholder="${state.bodyLog.length?state.bodyLog[state.bodyLog.length-1].weightLb:'e.g. 180'}">
        <button class="btn small" onclick="logBodyWeight()">Log</button>
      </div>
    </div>
    <div class="card">
      <label class="field">Protein target (g per lb body weight)</label>
      <div class="muscle-row" style="margin-top:4px;"><span class="name">Training days</span><input type="number" step="0.1" style="width:70px;" value="${state.protein.workout}" onchange="updateProtein('workout',this.value)"></div>
      <div class="muscle-row"><span class="name">Rest days</span><input type="number" step="0.1" style="width:70px;" value="${state.protein.rest}" onchange="updateProtein('rest',this.value)"></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">Evidence-based hypertrophy intake is roughly 0.7–1g per lb of body weight, and total daily protein matters far more than which day it lands on — training vs. rest day needs don't differ much. Two fields are here so you can weight training days slightly higher if you want; the defaults reflect the research, not a bro-science split.</div>
    </div>`;

  html += `<h2 class="section-title">Equipment</h2><div class="card"><div style="color:var(--text-muted);font-size:13px;">${EQUIPMENT.map(e=>e.replace('_',' ')).join(", ")}</div>
  <div style="font-size:12px;color:var(--text-faint);margin-top:8px;">To change this, edit the EQUIPMENT list near the top of the app's code and reopen the file.</div></div>`;

  html += `<h2 class="section-title">Data</h2><div class="card stack">
    <button class="btn ghost block" onclick="exportData()">Export backup (JSON)</button>
    <label class="btn ghost block" style="text-align:center;">Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>
    <button class="btn danger block" onclick="confirmWipe()">Erase all data</button>
  </div>`;
  html += `<div class="footer-note">Iron Ledger — all data stays on this device.</div>`;
  mainEl.innerHTML = html;
}
function updateLandmark(key, field, val){
  state.muscleLandmarks[key][field] = parseInt(val,10)||0;
  saveState();
}
function updateIncrement(key,val){ state.increments[key] = parseFloat(val)||0; saveState(); }
function updateSessionCap(val){ state.sessionSetCap = parseInt(val,10)||24; saveState(); }
function updateProtein(key,val){ state.protein[key] = parseFloat(val)||0; saveState(); }
function logBodyWeight(){
  const val = parseFloat(document.getElementById('newBodyWeight').value);
  if(isNaN(val)) return;
  state.bodyLog.push({ts:Date.now(), weightLb:val});
  saveState();
  renderSettings(activeMeso());
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `iron-ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      state = Object.assign(defaultState(), parsed);
      saveState();
      render();
    }catch(e){ alert("Couldn't read that file — is it an Iron Ledger backup?"); }
  };
  reader.readAsText(file);
}
function confirmWipe(){
  modalRoot.innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal"><h3>Erase all data?</h3><p>This deletes every mesocycle and log on this device. Export a backup first if you want to keep it.</p>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="wipeData()">Erase everything</button></div></div></div>`;
}
function wipeData(){
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  closeModal();
  render();
}

/* ---------------------------- INIT ---------------------------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
render();
</script>
</body>
</html>
